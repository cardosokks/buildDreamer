server.port=5000

# Database Settings
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:builder_db}?schema=public
spring.datasource.username=${DATABASE_USER:builder_user}
spring.datasource.password=${DATABASE_PASSWORD:builder_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT settings
jwt.secret=${JWT_SECRET:super-secret-key-change-in-prod-must-be-very-long-to-be-secure}
jwt.expiration=86400000

# File Upload Settings
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Enable Async Thread Pools
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100
