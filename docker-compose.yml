services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: builder_user
      POSTGRES_PASSWORD: builder_password
      POSTGRES_DB: builder_db
    ports:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    expose:
      - "5000"
    environment:
      - API_URL=${API_URL}
      - PORT=${PORT}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FTP_HOST=${FTP_HOST}
      - FTP_PORT=${FTP_PORT}
      - FTP_USER=${FTP_USER}
      - FTP_PASSWORD=${FTP_PASSWORD}
    depends_on:
      - postgres
      - ftp

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    expose:
      - "80"
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    depends_on:
      - backend

  ftp:
    image: delfer/alpine-ftp-server:latest
    restart: always
    ports:
      - "${FTP_PORT}:${FTP_PORT}"
      - "21000-21010:21000-21010"
    environment:
      - FTP_USER=${FTP_USER}
      - FTP_PASS=${FTP_PASSWORD}
      - MIN_PORT=21000
      - MAX_PORT=21010
    volumes:
      - ftp_data:/ftp/ftpuser

volumes:
  postgres_data:
  ftp_data:
