version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: builder-postgres
    restart: always
    environment:
      POSTGRES_USER: builder_user
      POSTGRES_PASSWORD: builder_password
      POSTGRES_DB: builder_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: builder-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://builder_user:builder_password@postgres:5432/builder_db?schema=public
      - JWT_SECRET=super-secret-key-change-in-prod
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: builder-frontend
    restart: always
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  postgres_data:
